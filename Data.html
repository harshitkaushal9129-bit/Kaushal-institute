<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registered Students Data - Ultra Neon Portal</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --text-color: #f8fafc;
      --primary-color: #38bdf8;
      --neon-glow: 0 0 15px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.2);
      --neon-border: 1px solid rgba(56, 189, 248, 0.6);
      --accent-green: #22c55e;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-image: linear-gradient(rgba(3, 7, 18, 0.82), rgba(3, 7, 18, 0.82)), url('kaushalji.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px 30px;
      border-radius: 14px;
      box-shadow: var(--neon-glow);
      border: var(--neon-border);
    }

    .header-container h2 {
      color: var(--primary-color);
      font-size: 24px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      letter-spacing: 1px;
    }

    .btn-back {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
      transition: 0.3s ease;
    }

    .btn-back:hover {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      transform: translateY(-2px);
    }

    .main-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .stats-bar {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      border: var(--neon-border);
      box-shadow: var(--neon-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stats-bar span {
      color: var(--primary-color);
      font-weight: bold;
      font-size: 18px;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .student-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 25px;
      border: var(--neon-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), var(--neon-glow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .student-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.8);
    }

    .student-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .student-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .student-title-info h3 {
      font-size: 18px;
      color: var(--primary-color);
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .student-title-info p {
      font-size: 12px;
      opacity: 0.7;
    }

    .info-group {
      margin-bottom: 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-label {
      opacity: 0.75;
      font-weight: 500;
    }

    .info-value {
      font-weight: 600;
      color: #f1f5f9;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-allowed {
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .status-restricted {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .utr-code {
      font-family: monospace;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .no-data {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      background: var(--card-bg);
      border-radius: 16px;
      border: var(--neon-border);
      box-shadow: var(--neon-glow);
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h2>⚡ Ultra Neon Student Database Portal</h2>
    <a href="index.html" class="btn-back">⬅ Back to Portal</a>
  </div>

  <div class="main-container">
    <div class="stats-bar">
      <span>Registered Students Overview</span>
      <div>Total Students: <span id="totalStudentsCount">0</span></div>
    </div>

    <div class="student-grid" id="studentGridContainer">
      <!-- Dynamic Student Cards will be injected here -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyCM0GFOIbXogloRj9cwWeNdk2PjCzm4gFE", authDomain: "kaushal-institute-729bc.firebaseapp.com", databaseURL: "https://kaushal-institute-729bc-default-rtdb.firebaseio.com", projectId: "kaushal-institute-729bc", storageBucket: "kaushal-institute-729bc.firebasestorage.app", messagingSenderId: "699990199933", appId: "1:699990199933:web:e5fae383e93de5d3c6ab14" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function loadAllStudentsData() {
      const gridContainer = document.getElementById('studentGridContainer');
      const totalCountSpan = document.getElementById('totalStudentsCount');
      
      let studentsMap = new Map();

      // 1. Firebase se course_enrollments fetch karein
      try {
        const snapshot = await get(child(ref(db), 'course_enrollments'));
        if (snapshot.exists()) {
          const fbData = snapshot.val();
          for (let key in fbData) {
            let item = fbData[key];
            if(item.email || item.mobile) {
              studentsMap.set(item.email || item.mobile, item);
            }
          }
        }
      } catch (err) {
        console.log("Firebase database fetch warning:", err);
      }

      const studentsArray = Array.from(studentsMap.values());
      totalCountSpan.innerText = studentsArray.length;
      gridContainer.innerHTML = '';

      if (studentsArray.length === 0) {
        gridContainer.innerHTML = `<div class="no-data">⚡ Abhi tak koi bhi student enrolled nahi hai.</div>`;
        return;
      }

      studentsArray.forEach((student) => {
        let userPic = student.pic ? student.pic : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        let courseName = student.course || 'General Course';
        let feeAmount = student.fee ? '₹' + Number(student.fee).toLocaleString('en-IN') : '₹0';
        let feeType = student.feeType ? `(${student.feeType})` : '';
        let batchTime = student.batch || 'Not Selected';
        let utrNumber = student.utr || 'N/A';
        let enrollDate = student.enrollmentDate || 'N/A';
        
        // Check if full paid or active
        let hasPaid = student.utr && student.utr !== 'N/A';
        let statusClass = hasPaid ? 'status-allowed' : 'status-restricted';
        let statusText = hasPaid ? 'Allowed (Verified)' : 'Restricted (Pending)';

        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <div class="student-header">
            <img src="${userPic}" alt="Student Avatar" class="student-avatar">
            <div class="student-title-info">
              <h3>${student.name || 'Unnamed Student'}</h3>
              <p>Enrolled: ${enrollDate}</p>
            </div>
          </div>
          <div class="info-group">
            <span class="info-label">📱 Mobile:</span>
            <span class="info-value">${student.mobile || 'N/A'}</span>
          </div>
          <div class="info-group">
            <span class="info-label">📧 Email:</span>
            <span class="info-value" style="font-size:12px; word-break:break-all;">${student.email || 'N/A'}</span>
          </div>
          <div class="info-group">
            <span class="info-label">📚 Course Available:</span>
            <span class="info-value" style="color: var(--primary-color);">${courseName} ${feeType}</span>
          </div>
          <div class="info-group">
            <span class="info-label">⏰ Batch Timing:</span>
            <span class="info-value" style="font-size: 11px;">${batchTime}</span>
          </div>
          <div class="info-group">
            <span class="info-label">💰 Fee Paid:</span>
            <span class="info-value" style="color: var(--accent-green); font-weight:700;">${feeAmount}</span>
          </div>
          <div class="info-group">
            <span class="info-label">🔢 UTR Number:</span>
            <span class="utr-code">${utrNumber}</span>
          </div>
          <div class="info-group">
            <span class="info-label">🔒 Access Status:</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', loadAllStudentsData);
  </script>
</body>
</html>
